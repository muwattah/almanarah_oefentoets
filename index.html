<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al-Manārah – Tussentijdse Oefentoets</title>
  <style>
    :root {
      --bg: #0f2a2a;
      --card: #163636;
      --accent: #c9a227;
      --text: #e8f0f0;
      --muted: #8ba3a3;
      --correct: #2e7d4f;
      --wrong: #9b2c2c;
      --partial: #b8860b;
      --border: #2a4a4a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
    }
    .container { max-width: 820px; margin: 0 auto; padding: 1.5rem; }
    header {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    header .logo { color: var(--accent); font-size: 0.9rem; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.4rem; }
    header h1 { font-size: 1.85rem; font-weight: 700; margin-bottom: 0.35rem; }
    header .subtitle { color: var(--muted); font-size: 1rem; }
    header .meta {
      display: flex; gap: 1.5rem; justify-content: center; margin-top: 1.2rem; flex-wrap: wrap;
    }
    header .meta span {
      background: var(--card); padding: 0.35rem 0.9rem; border-radius: 999px;
      font-size: 0.85rem; border: 1px solid var(--border);
    }
    .progress-bar {
      height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 1.5rem; overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }
    .score-panel {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;
    }
    .score-panel .label { color: var(--muted); font-size: 0.85rem; }
    .score-panel .value { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
    .section-title {
      color: var(--accent); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }
    .question-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 1.5rem; margin-bottom: 1.25rem;
    }
    .q-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.75rem; gap: 1rem; }
    .q-num {
      background: var(--accent); color: #0f2a2a; font-weight: 700; font-size: 0.8rem;
      padding: 0.2rem 0.55rem; border-radius: 6px; white-space: nowrap;
    }
    .q-points { color: var(--muted); font-size: 0.85rem; }
    .q-text { font-size: 1.05rem; margin-bottom: 1rem; }
    .source {
      background: rgba(201,162,39,0.08); border-left: 3px solid var(--accent);
      padding: 0.7rem 1rem; margin-bottom: 1rem; border-radius: 0 8px 8px 0; font-size: 0.95rem;
    }
    .source .ref { color: var(--accent); font-size: 0.8rem; margin-bottom: 0.25rem; }
    .source .arabic { font-family: 'Amiri', 'Scheherazade New', serif; font-size: 1.25rem; direction: rtl; text-align: right; }
    .options { display: flex; flex-direction: column; gap: 0.55rem; }
    .option {
      display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem 1rem;
      background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 10px;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .option:hover { border-color: var(--accent); background: rgba(201,162,39,0.06); }
    .option.selected { border-color: var(--accent); background: rgba(201,162,39,0.12); }
    .option.correct { border-color: var(--correct); background: rgba(46,125,79,0.15); }
    .option.wrong { border-color: var(--wrong); background: rgba(155,44,44,0.15); }
    .option input { margin-top: 0.2rem; accent-color: var(--accent); }
    .option-letter { font-weight: 700; color: var(--accent); min-width: 1.4rem; }
    .open-answer {
      width: 100%; min-height: 100px; padding: 0.85rem 1rem; border-radius: 10px;
      border: 1px solid var(--border); background: rgba(0,0,0,0.25); color: var(--text);
      font-family: inherit; font-size: 0.95rem; resize: vertical;
    }
    .open-answer:focus { outline: none; border-color: var(--accent); }
    .open-answer.feedback-good { border-color: var(--correct); }
    .open-answer.feedback-partial { border-color: var(--partial); }
    .open-answer.feedback-poor { border-color: var(--wrong); }
    .btn-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.25rem; }
    button {
      font-family: inherit; font-size: 0.95rem; font-weight: 600; padding: 0.65rem 1.3rem;
      border-radius: 10px; border: none; cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #0f2a2a; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-show { background: transparent; color: var(--muted); border: 1px solid var(--border); font-size: 0.85rem; padding: 0.4rem 0.9rem; }
    .btn-check-open { background: transparent; color: var(--accent); border: 1px solid var(--accent); font-size: 0.85rem; padding: 0.4rem 0.9rem; }
    .model-answer {
      display: none; margin-top: 1rem; padding: 1rem; background: rgba(46,125,79,0.12);
      border: 1px solid var(--correct); border-radius: 10px; font-size: 0.95rem;
    }
    .model-answer.visible { display: block; }
    .model-answer strong { color: var(--accent); }
    .grading { color: var(--muted); font-size: 0.85rem; margin-top: 0.5rem; }
    .open-feedback {
      display: none; margin-top: 0.75rem; padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.9rem;
    }
    .open-feedback.visible { display: block; }
    .open-feedback.good { background: rgba(46,125,79,0.15); border: 1px solid var(--correct); }
    .open-feedback.partial { background: rgba(184,134,11,0.15); border: 1px solid var(--partial); }
    .open-feedback.poor { background: rgba(155,44,44,0.15); border: 1px solid var(--wrong); }
    .nav {
      display: flex; justify-content: space-between; align-items: center; margin-top: 2rem;
      padding-top: 1.5rem; border-top: 1px solid var(--border); gap: 1rem; flex-wrap: wrap;
    }
    .filter-bar {
      display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .filter-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      padding: 0.4rem 0.9rem; border-radius: 999px; font-size: 0.85rem; cursor: pointer;
    }
    .filter-btn.active, .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .result-screen {
      text-align: center; padding: 3rem 1rem; display: none;
    }
    .result-screen.visible { display: block; }
    .result-score { font-size: 3.5rem; font-weight: 800; color: var(--accent); margin: 1rem 0; }
    .result-label { color: var(--muted); font-size: 1.1rem; }
    footer {
      text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 0.85rem;
      border-top: 1px solid var(--border); margin-top: 3rem;
    }
    .hint {
      font-size: 0.8rem; color: var(--muted); margin-top: 0.4rem;
    }
    @media (max-width: 600px) {
      header h1 { font-size: 1.4rem; }
      .question-card { padding: 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">AL-MANĀRAH · المنارة</div>
      <h1>Tussentijdse Oefentoets</h1>
      <div class="subtitle">Al-Wājibāt al-Mutaḥattimāt</div>
      <div class="meta">
        <span>30 vragen</span>
        <span>100 punten</span>
        <span>90 minuten</span>
      </div>
    </header>

    <div id="quiz-area">
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

      <div class="score-panel">
        <div>
          <div class="label">Voortgang</div>
          <div class="value" id="progress-text">0 / 30</div>
        </div>
        <div>
          <div class="label">Huidige score (MC)</div>
          <div class="value" id="mc-score">0 / 20</div>
        </div>
      </div>

      <div class="filter-bar" id="filters">
        <button class="filter-btn active" data-section="all">Alles</button>
        <button class="filter-btn" data-section="A">A · Meerkeuze</button>
        <button class="filter-btn" data-section="B">B · Begrippen</button>
        <button class="filter-btn" data-section="C">C · Bewijzen</button>
        <button class="filter-btn" data-section="D">D · Toepassing</button>
        <button class="filter-btn" data-section="E">E · Inzicht</button>
      </div>

      <div id="questions"></div>

      <div class="nav">
        <button class="btn-secondary" id="btn-reset">Reset antwoorden</button>
        <button class="btn-primary" id="btn-check">Controleer meerkeuze</button>
      </div>
    </div>

    <div class="result-screen" id="result">
      <div class="result-label">Meerkeuze resultaat</div>
      <div class="result-score" id="final-score">0</div>
      <div class="result-label" id="final-label">punten van 20</div>
      <div class="btn-row" style="justify-content:center;margin-top:2rem">
        <button class="btn-primary" id="btn-back">Terug naar quiz</button>
      </div>
    </div>

    <footer>
      Gebaseerd op de lessen van Shaykh Abū Muḥammad al-Shāmī ḥafiẓahullāh<br>
      والحمد لله رب العالمين
    </footer>
  </div>

  <script>
    let quizData = null;
    let answers = {};

    // Stopwoorden die we negeren bij vergelijking
    const STOP = new Set([
      'de','het','een','van','en','in','op','te','dat','die','is','zijn','voor','met',
      'aan','als','om','bij','uit','naar','ook','nog','niet','geen','wel','dit','deze',
      'worden','wordt','werd','waren','heeft','hebben','had','kan','kunnen','moet','zou',
      'of','maar','door','over','tot','er','ze','hij','zij','we','wij','je','jij','u',
      'haar','hem','hun','ons','mijn','jouw','uw','zo','meer','veel','alle','al','dan',
      'wat','wie','waar','hoe','waarom','welke','welk','iets','niets','alles','iemand',
      'the','a','an','of','to','and','in','is','it','for','on','with','as','by','at'
    ]);

    function normalize(text) {
      if (!text) return '';
      return text
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')          // strip accents
        .replace(/[ʿʾʼ']/g, '')                   // Arabic hamza-achtige tekens
        .replace(/[^\w\s\u0600-\u06FF]/g, ' ')   // behoud letters + Arabisch
        .replace(/\s+/g, ' ')
        .trim();
    }

    function getWords(text) {
      return normalize(text)
        .split(' ')
        .filter(w => w.length > 2 && !STOP.has(w));
    }

    // Levenshtein distance (voor kleine spelfouten)
    function levenshtein(a, b) {
      if (a === b) return 0;
      if (!a.length) return b.length;
      if (!b.length) return a.length;
      const m = a.length, n = b.length;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }

    function wordsMatch(w1, w2) {
      if (w1 === w2) return true;
      // Korte woorden: exact of 1 verschil
      const maxDist = w1.length <= 4 ? 1 : (w1.length <= 7 ? 2 : 3);
      return levenshtein(w1, w2) <= maxDist;
    }

    function scoreOpenAnswer(userText, modelText) {
      const userWords = getWords(userText);
      const modelWords = [...new Set(getWords(modelText))]; // unieke modelwoorden

      if (userWords.length === 0) return { score: 0, matched: 0, total: modelWords.length };

      let matched = 0;
      for (const mw of modelWords) {
        if (userWords.some(uw => wordsMatch(uw, mw))) matched++;
      }

      const ratio = modelWords.length ? matched / modelWords.length : 0;
      return { score: ratio, matched, total: modelWords.length };
    }

    function feedbackLabel(ratio) {
      if (ratio >= 0.55) return { level: 'good', text: 'Goed genoeg – de kern lijkt aanwezig' };
      if (ratio >= 0.30) return { level: 'partial', text: 'Gedeeltelijk – enkele belangrijke punten missen' };
      return { level: 'poor', text: 'Onvolledig – kijk het modelantwoord na' };
    }

    async function loadQuiz() {
      try {
        const res = await fetch('al_manarah_quiz_30_vragen.json');
        quizData = await res.json();
        renderQuestions('all');
      } catch (e) {
        document.getElementById('questions').innerHTML =
          '<p style="color:#c44">Kon quiz niet laden. Controleer of al_manarah_quiz_30_vragen.json aanwezig is.</p>';
      }
    }

    function renderQuestions(sectionFilter) {
      const container = document.getElementById('questions');
      container.innerHTML = '';
      const qs = quizData.questions.filter(q => sectionFilter === 'all' || q.section === sectionFilter);

      qs.forEach(q => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.dataset.id = q.id;

        let html = `
          <div class="section-title">Onderdeel ${q.section} · ${q.section_title}</div>
          <div class="q-header">
            <span class="q-num">Vraag ${q.id}</span>
            <span class="q-points">${q.points} p</span>
          </div>
          <div class="q-text">${q.question}</div>
        `;

        if (q.source) {
          html += `
            <div class="source">
              <div class="ref">${q.source.reference}</div>
              <div class="arabic">${q.source.arabic || ''}</div>
            </div>`;
        }

        if (q.type === 'multiple_choice') {
          html += '<div class="options">';
          for (const [letter, text] of Object.entries(q.options)) {
            const checked = answers[q.id] === letter ? 'checked' : '';
            html += `
              <label class="option ${answers[q.id] === letter ? 'selected' : ''}" data-q="${q.id}" data-ans="${letter}">
                <input type="radio" name="q${q.id}" value="${letter}" ${checked} />
                <span class="option-letter">${letter}</span>
                <span>${text}</span>
              </label>`;
          }
          html += '</div>';
        } else {
          const val = answers[q.id] || '';
          html += `
            <textarea class="open-answer" data-q="${q.id}" placeholder="Schrijf je antwoord hier...">${val}</textarea>
            <div class="hint">Kleine spelfouten en andere formuleringen worden toleranter beoordeeld.</div>
            <div class="open-feedback" id="fb-${q.id}"></div>`;
        }

        html += `<div class="btn-row">`;
        if (q.type !== 'multiple_choice') {
          html += `<button class="btn-check-open" data-check="${q.id}">Controleer antwoord</button>`;
        }
        html += `
            <button class="btn-show" data-show="${q.id}">Toon modelantwoord</button>
          </div>
          <div class="model-answer" id="model-${q.id}">
            <strong>Modelantwoord:</strong><br>${q.model_answer}<br>
            <div class="grading">${q.grading || ''}</div>
          </div>`;

        card.innerHTML = html;
        container.appendChild(card);
      });

      // Events – meerkeuze
      document.querySelectorAll('.option').forEach(opt => {
        opt.addEventListener('click', () => {
          const qid = opt.dataset.q;
          const ans = opt.dataset.ans;
          answers[qid] = ans;
          document.querySelectorAll(`.option[data-q="${qid}"]`).forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          opt.querySelector('input').checked = true;
          updateProgress();
        });
      });

      // Events – open tekst
      document.querySelectorAll('.open-answer').forEach(ta => {
        ta.addEventListener('input', () => {
          answers[ta.dataset.q] = ta.value;
          updateProgress();
          // reset feedback styling bij typen
          ta.classList.remove('feedback-good', 'feedback-partial', 'feedback-poor');
          const fb = document.getElementById('fb-' + ta.dataset.q);
          if (fb) { fb.className = 'open-feedback'; fb.textContent = ''; }
        });
      });

      // Toon modelantwoord
      document.querySelectorAll('.btn-show').forEach(btn => {
        btn.addEventListener('click', () => {
          const el = document.getElementById('model-' + btn.dataset.show);
          el.classList.toggle('visible');
          btn.textContent = el.classList.contains('visible') ? 'Verberg modelantwoord' : 'Toon modelantwoord';
        });
      });

      // Controleer open antwoord (tolerant)
      document.querySelectorAll('.btn-check-open').forEach(btn => {
        btn.addEventListener('click', () => {
          const qid = btn.dataset.check;
          const q = quizData.questions.find(x => x.id == qid);
          const userText = answers[qid] || '';
          const ta = document.querySelector(`.open-answer[data-q="${qid}"]`);
          const fb = document.getElementById('fb-' + qid);

          if (!userText.trim()) {
            fb.className = 'open-feedback visible poor';
            fb.textContent = 'Nog geen antwoord ingevuld.';
            ta.classList.add('feedback-poor');
            return;
          }

          const result = scoreOpenAnswer(userText, q.model_answer);
          const label = feedbackLabel(result.score);
          const pct = Math.round(result.score * 100);

          ta.classList.remove('feedback-good', 'feedback-partial', 'feedback-poor');
          ta.classList.add('feedback-' + label.level);
          fb.className = 'open-feedback visible ' + label.level;
          fb.innerHTML = `<strong>${label.text}</strong><br>
            Overeenkomst kernwoorden: ±${pct}% (${result.matched} van ${result.total} belangrijke woorden herkend).<br>
            <span style="opacity:0.8">Dit is een indicatie – vergelijk altijd zelf met het modelantwoord.</span>`;

          // Automatisch modelantwoord tonen bij partial/poor
          if (label.level !== 'good') {
            const modelEl = document.getElementById('model-' + qid);
            modelEl.classList.add('visible');
            const showBtn = document.querySelector(`.btn-show[data-show="${qid}"]`);
            if (showBtn) showBtn.textContent = 'Verberg modelantwoord';
          }
        });
      });

      updateProgress();
    }

    function updateProgress() {
      const total = quizData.questions.length;
      const answered = Object.keys(answers).filter(k => answers[k] && String(answers[k]).trim()).length;
      document.getElementById('progress').style.width = (answered / total * 100) + '%';
      document.getElementById('progress-text').textContent = `${answered} / ${total}`;
    }

    function checkMC() {
      let score = 0;
      const mc = quizData.questions.filter(q => q.type === 'multiple_choice');
      mc.forEach(q => {
        const labels = document.querySelectorAll(`.option[data-q="${q.id}"]`);
        labels.forEach(l => {
          l.classList.remove('correct', 'wrong');
          if (l.dataset.ans === q.correct_answer) l.classList.add('correct');
          else if (answers[q.id] === l.dataset.ans) l.classList.add('wrong');
        });
        if (answers[q.id] === q.correct_answer) score += q.points;
      });
      document.getElementById('mc-score').textContent = `${score} / 20`;
      document.getElementById('final-score').textContent = score;
      document.getElementById('final-label').textContent = 'punten van 20 (meerkeuze)';
      document.getElementById('quiz-area').style.display = 'none';
      document.getElementById('result').classList.add('visible');
    }

    document.getElementById('btn-check').addEventListener('click', checkMC);
    document.getElementById('btn-back').addEventListener('click', () => {
      document.getElementById('result').classList.remove('visible');
      document.getElementById('quiz-area').style.display = 'block';
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      if (confirm('Alle antwoorden wissen?')) {
        answers = {};
        renderQuestions(document.querySelector('.filter-btn.active').dataset.section);
        document.getElementById('mc-score').textContent = '0 / 20';
      }
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderQuestions(btn.dataset.section);
      });
    });

    loadQuiz();
  </script>
</body>
</html>
